<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Fishing Legends 2D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">🎣 <b>FISHING LEGENDS</b><small>2D</small></div>
  <div class="money">💰 <span id="money">0</span></div>
</header>

<main>
<section id="lobby" class="screen active">
  <div class="hero">
    <div class="hero-water"></div>
    <div class="title">FISHING<br><span>LEGENDS</span></div>
    <div class="subtitle">Chinh phục đại dương • Nâng cần • Bắt cá khổng lồ</div>
    <button id="startBtn" class="primary">🎣 BẮT ĐẦU CÂU</button>
  </div>
  <div class="menu-grid">
    <button data-open="shop">🛒<b>CỬA HÀNG</b><small>Nâng cấp cần</small></button>
    <button data-open="skills">⚡<b>KỸ NĂNG</b><small>Nâng skill</small></button>
    <button data-open="stages">🌊<b>KHU VỰC</b><small>Mở vùng mới</small></button>
    <button id="resetBtn">↻<b>ĐẶT LẠI</b><small>Xóa tiến trình</small></button>
  </div>
  <div class="progress-card">
    <span>Tiến trình khu vực</span><b id="lobbyStage">Hồ Tân Thủ</b>
    <div class="bar"><i id="stageProgress"></i></div>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-head">
    <button id="backLobby">←</button>
    <div><b id="stageName">Hồ Tân Thủ</b><small id="fishName">Cá Rô</small></div>
    <div class="hud-money">💰 <span id="gameMoney">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="game-ui">
    <div class="fish-hud">
      <div><span id="fishLabel">🐟 Cá Rô</span><b id="fishHpText">0 / 0</b></div>
      <div class="hpbar"><i id="fishHp"></i></div>
    </div>
    <div class="line-hud">
      <div><span>🧵 Độ căng dây</span><b id="lineText">0%</b></div>
      <div class="tension"><i id="lineBar"></i></div>
    </div>
    <div class="controls">
      <button id="skillBtn">⚡ SKILL</button>
      <button id="reelBtn" class="reel">🎣 GIỮ ĐỂ KÉO</button>
    </div>
    <div class="hint" id="gameHint">Giữ nút để kéo cá. Nhả ra khi dây quá căng!</div>
  </div>
</section>

<section id="shop" class="screen panel-screen">
  <div class="panel-head"><button class="closePanel">←</button><h2>🛒 Cửa hàng cần câu</h2></div>
  <div id="shopList" class="cards"></div>
</section>

<section id="skills" class="screen panel-screen">
  <div class="panel-head"><button class="closePanel">←</button><h2>⚡ Kỹ năng</h2></div>
  <div id="skillList" class="cards"></div>
</section>

<section id="stages" class="screen panel-screen">
  <div class="panel-head"><button class="closePanel">←</button><h2>🌊 Khu vực</h2></div>
  <div id="stageList" class="cards"></div>
</section>
</main>

<div id="toast"></div>
<script src="js/save.js"></script>
<script src="js/fish.js"></script>
<script src="js/player.js"></script>
<script src="js/fishing.js"></script>
<script src="js/skills.js"></script>
<script src="js/shop.js"></script>
<script src="js/stages.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07100b"><title>Zombie Outbreak Online</title><link rel="stylesheet" href="style.css"></head><body>
<section id="lobby"><div class="hero"><div>☣ ONLINE SURVIVAL</div><h1>ZOMBIE <b>OUTBREAK</b></h1><p>Sống sót cùng đồng đội • tối đa 4 người</p></div>
<div class="card"><label>TÊN NGƯỜI CHƠI</label><input id="name" maxlength="18" value="Player" placeholder="Tên của bạn"><button id="create">🧟 TẠO PHÒNG</button><button id="showJoin" class="secondary">🔑 THAM GIA PHÒNG</button><div id="joinBox" class="hidden"><label>MÃ PHÒNG</label><input id="roomInput" maxlength="6" placeholder="ABC123"><button id="join">🚪 VÀO PHÒNG</button></div><div id="status">Đang kết nối máy chủ...</div></div>
<div id="roomPanel" class="card hidden"><div class="roomHead"><div><small>MÃ PHÒNG</small><strong id="roomCode">------</strong></div><button id="copy">COPY</button></div><div id="players"></div><button id="start">▶ BẮT ĐẦU TRẬN</button><button id="leave" class="danger">RỜI PHÒNG</button><p>Gửi mã phòng cho bạn bè để cùng chơi.</p></div></section>
<section id="game" class="hidden"><canvas id="canvas"></canvas><div class="hud"><span>❤️ <b id="hp">100</b></span><span>🎯 <b id="score">0</b></span><span>👥 <b id="count">1/4</b></span><span>WAVE <b id="wave">1</b></span><button id="pause">☰</button></div><div id="joy"><i></i></div><div id="shoot">KÉO ĐỂ NGẮM<br><b>THẢ ĐỂ BẮN</b></div><div id="overlay" class="hidden"><div><h2>⏸ GAME</h2><button id="resume">TIẾP TỤC</button><button id="back" class="secondary">VỀ SẢNH</button></div></div></section><script src="game.js"></script></body></html>
